spring.application.name=sals


# ===============================
# 1. SERVER
# ===============================
server.port=8080
# Behind the Nginx reverse proxy: trust X-Forwarded-* headers
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===============================
# 2. MYSQL (RDS)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sals?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# 3. MONGODB (DocumentDB)  - URI contains credentials, so it is a secret
# ===============================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# ===============================
# 4. GEMINI
# ===============================
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=
gemini.api.key=${GEMINI_API_KEY}

# ===============================
# 5. JWT
# ===============================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===============================
# 6. EMAIL ALERTS (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# 7. SERVICE URLS
# ===============================
ai.server.url=${AI_SERVER_URL:http://localhost:8000/verify-face}
vite.fe.url=${VITE_FE_URL:http://localhost:5173}

# ===============================
# 8. HEALTH CHECK (spring-boot-starter-actuator)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false