
name: sals-proxy

services:
  proxy:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/sals-proxy:${IMAGE_TAG:?set IMAGE_TAG}
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST}
      PUBLIC_IP: ${PUBLIC_IP:-}
    volumes:
      - certs:/etc/nginx/certs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  certs:
