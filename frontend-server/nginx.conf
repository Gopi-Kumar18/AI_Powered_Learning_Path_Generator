# Private frontend server: serves the built React files only.
# TLS and /api routing are handled by the reverse proxy in the public subnet.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location = /ping {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (replaces vercel.json rewrite)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
